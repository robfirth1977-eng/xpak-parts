<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Repair — X-Pak Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a2442; --navy-light:#193049; --blue:#29abe3; --orange:#f2873b;
    --page-bg:#eef1f5; --card-bg:#ffffff; --border:#d7dee6; --text:#243447; --muted:#6b7c91;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--page-bg);color:var(--text);min-height:100vh}
  .hero{background:linear-gradient(135deg,var(--navy),var(--navy-light));padding:28px 16px 34px;text-align:center}
  .brand{display:flex;align-items:baseline;justify-content:center;gap:6px}
  .brand-x{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:0.5px}
  .brand-pak{font-size:26px;font-weight:800;color:#fff;letter-spacing:0.5px}
  .hero h1{color:#fff;font-size:20px;font-weight:600;margin:10px 0 4px}
  .hero p{color:#b9c8da;font-size:13px;margin:0}
  .wrap{width:100%;max-width:480px;margin:0 auto;padding:0 16px 60px}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:22px 20px;margin-top:-18px;box-shadow:0 12px 32px rgba(10,36,66,0.12)}
  .field{margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px}
  .opt{font-weight:400;text-transform:none;color:var(--muted);letter-spacing:0}
  input,textarea,select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:#fbfcfd;color:var(--text);font-size:15px;outline:none;font-family:inherit}
  input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(41,171,227,0.15)}
  textarea{min-height:90px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:420px){.row2{grid-template-columns:1fr}}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .btn-submit{width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
  .btn-submit:disabled{opacity:0.6;cursor:default}
  .err{color:#c0392b;font-size:13px;margin-top:10px;display:none}
  .success{display:none;text-align:center;padding:20px 4px}
  .success .tick{font-size:44px;color:var(--blue);margin-bottom:10px}
  .success h2{margin:0 0 8px;font-size:19px;color:var(--navy)}
  .success p{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
  .tool-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:#f7f9fb}
  .tool-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .tool-card-top span{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:0.4px}
  .tool-remove{background:none;border:none;color:#c0392b;font-size:13px;cursor:pointer;padding:2px 6px}
  .btn-add-tool{width:100%;padding:10px;background:#fff;color:var(--blue);border:1.5px solid var(--blue);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px}
</style>
</head>
<body>
<div class="hero">
  <div class="brand"><span class="brand-x">X</span><span class="brand-pak">-PAK</span></div>
  <h1>Request a Repair</h1>
  <p>Submit your details below and we'll be in touch.</p>
</div>
<div class="wrap">
  <div class="card">
    <form id="intakeForm">
      <div class="field"><label>Company / Business Name *</label><input id="fCompany" required autocomplete="organization"></div>
      <div class="row2">
        <div class="field"><label>Your Name *</label><input id="fContact" required autocomplete="name"></div>
        <div class="field"><label>Phone *</label><input id="fPhone" type="tel" required autocomplete="tel"></div>
      </div>
      <div class="field"><label>Email *</label><input id="fEmail" type="email" required autocomplete="email"></div>
      <div class="field"><label>Pickup / Site Address *</label><input id="fAddress" required autocomplete="street-address"></div>
      <div class="field"><label>Order / PO Number <span class="opt">if you need one on file</span></label><input id="fOrderNum"></div>

      <div class="field">
        <label>Tool(s) Being Sent</label>
        <div id="toolsList"></div>
        <button type="button" class="btn-add-tool" id="btnAddTool">+ Add Tool</button>
      </div>

      <div class="row2">
        <div class="field"><label>Loan Tool Needed? *</label>
          <select id="fLoanNeeded" required>
            <option value="">-- Select --</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="not_sure">Not sure</option>
          </select>
        </div>
        <div class="field"><label>Ready for Courier Pickup? *</label>
          <select id="fReadyPickup" required>
            <option value="">-- Select --</option>
            <option value="yes">Yes, packed and ready</option>
            <option value="no">No, not yet</option>
          </select>
        </div>
      </div>

      <div class="field"><label>What's the Problem? *</label><textarea id="fFault" required placeholder="Describe the fault or what's needed..."></textarea></div>
      <input class="hp" id="fWebsite" tabindex="-1" autocomplete="off">
      <button type="submit" class="btn-submit" id="btnSubmit">Send Request</button>
      <div class="err" id="errMsg"></div>
    </form>
    <div class="success" id="successBox">
      <div class="tick">&#10003;</div>
      <h2>Request received</h2>
      <p>Thanks — we've got your details and will be in touch shortly about next steps.</p>
    </div>
  </div>
  <div class="foot">X-Pak Global Service Division &middot; Load Containment Specialists</div>
</div>

<script>
var SUPABASE_URL = 'https://hoahfuxxefvfgxcjyqhp.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvYWhmdXh4ZWZ2Zmd4Y2p5cWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDk5OTEsImV4cCI6MjA5Mjg4NTk5MX0.rqV79ekcylTNqlAEIENJZe_lhuxBhhE54d2CXfRve8g';
var _loadedAt = Date.now();
var toolRows = [];

function addToolRow() {
  toolRows.push({ description: '', serial: '' });
  renderToolRows();
}
function removeToolRow(i) {
  toolRows.splice(i, 1);
  renderToolRows();
}
function setToolRow(i, field, val) {
  toolRows[i][field] = val;
}
function renderToolRows() {
  var el = document.getElementById('toolsList');
  el.innerHTML = toolRows.map(function(t, i) {
    return '<div class="tool-card">' +
      '<div class="tool-card-top"><span>Tool ' + (i + 1) + '</span>' +
      (toolRows.length > 1 ? '<button type="button" class="tool-remove" onclick="removeToolRow(' + i + ')">Remove</button>' : '') +
      '</div>' +
      '<div class="field" style="margin-bottom:8px"><label>Brand / Model <span class="opt">if known</span></label><input value="' + t.description.replace(/"/g,'&quot;') + '" placeholder="e.g. Strapex STB 73" oninput="setToolRow(' + i + ',\'description\',this.value)"></div>' +
      '<div class="field" style="margin-bottom:0"><label>Serial Number <span class="opt">if known</span></label><input value="' + t.serial.replace(/"/g,'&quot;') + '" oninput="setToolRow(' + i + ',\'serial\',this.value)"></div>' +
    '</div>';
  }).join('');
}
document.getElementById('btnAddTool').addEventListener('click', addToolRow);
addToolRow();

document.getElementById('intakeForm').addEventListener('submit', function(e){
  e.preventDefault();
  var errEl = document.getElementById('errMsg');
  errEl.style.display = 'none';

  // Honeypot + minimum-time-on-page check to filter obvious bots without a CAPTCHA.
  if (document.getElementById('fWebsite').value) { return; }
  if (Date.now() - _loadedAt < 1500) { return; }

  var cleanTools = toolRows
    .map(function(t){ return { description: t.description.trim(), serial_number: t.serial.trim() }; })
    .filter(function(t){ return t.description || t.serial_number; });

  var payload = {
    company_name: document.getElementById('fCompany').value.trim(),
    contact_name: document.getElementById('fContact').value.trim(),
    phone: document.getElementById('fPhone').value.trim(),
    email: document.getElementById('fEmail').value.trim(),
    address: document.getElementById('fAddress').value.trim(),
    order_number: document.getElementById('fOrderNum').value.trim() || null,
    tools: cleanTools,
    loan_tool_needed: document.getElementById('fLoanNeeded').value || null,
    ready_for_pickup: document.getElementById('fReadyPickup').value === 'yes' ? true : (document.getElementById('fReadyPickup').value === 'no' ? false : null),
    fault_description: document.getElementById('fFault').value.trim()
  };
  if (!payload.company_name || !payload.contact_name || !payload.phone || !payload.email || !payload.address || !payload.fault_description || !payload.loan_tool_needed || payload.ready_for_pickup === null) {
    errEl.textContent = 'Please fill in all required fields.';
    errEl.style.display = 'block';
    return;
  }

  var btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Sending...';

  fetch(SUPABASE_URL + '/rest/v1/job_intake_requests', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Content-Profile': 'public',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(payload)
  }).then(function(res){
    if (!res.ok) throw new Error('Request failed (' + res.status + ')');
    document.getElementById('intakeForm').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  }).catch(function(e){
    errEl.textContent = 'Something went wrong sending your request. Please call us on 1300 551 281 instead.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Send Request';
  });
});
</script>
</body>
</html>
